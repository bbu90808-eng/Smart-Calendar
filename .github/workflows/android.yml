
name: Build Smart Calendar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Build APK
        
        run: |
            mkdir project
            unzip SmartCalendar-Android-Project.zip -d project
            sed -i 's/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' project/app/build.gradle
            gradle -p project assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Calendar-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
